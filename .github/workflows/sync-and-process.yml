name: Sync and Process Files

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v7
        with:
          repository: lainbo/gists-hub
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gists-hub

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd gists-hub
          MIHOMO_URL=$(curl -fsSL --retry 3 --header "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const release = JSON.parse(data); const asset = release.assets.find(item => /^mihomo-linux-amd64-v1-.*\.gz$/.test(item.name)); if (!asset) { console.error('未找到 linux amd64 v1 mihomo release asset'); process.exit(1); } console.log(asset.browser_download_url); });")
          curl -fsSL --retry 3 "$MIHOMO_URL" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Generate QuantumultX de-advertising files
        run: |
          # 创建存放需要处理格式文件的目标文件夹
          mkdir -p gists-hub/src/QuantumultX/List/RemoteAdRules gists-hub/src/QuantumultX/List/RemoteOtherRules
          # 下载文件
          curl -fsSL --retry 3 -o gists-hub/src/QuantumultX/List/RemoteAdRules/BanAD.list https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
          curl -fsSL --retry 3 -o gists-hub/src/QuantumultX/List/RemoteAdRules/BanEasyList.list https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list
          curl -fsSL --retry 3 -o gists-hub/src/QuantumultX/List/RemoteAdRules/BanEasyListChina.list https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list

          curl -fsSL --retry 3 -o gists-hub/src/QuantumultX/List/RemoteOtherRules/GoogleCNProxyIP.list https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

          cd gists-hub

          sed -i '/^DOMAIN/{s/^DOMAIN/HOST/; s/$/,Advertising/}' src/QuantumultX/List/RemoteAdRules/*.list
          sed -i '/^IP-CIDR.*no-resolve/s/no-resolve/Advertising,&/' src/QuantumultX/List/RemoteAdRules/*.list
          sed -i '/^IP-CIDR.*no-resolve/s/no-resolve/Proxy,&/' src/QuantumultX/List/RemoteOtherRules/GoogleCNProxyIP.list
          echo "已经将广告规则文件处理为QuantumultX可用的格式"

      - name: Generate Clash rule files
        run: |
          cd gists-hub
          npm run generateDirectAppList
          echo "已生成 CustomDirectApp.list 文件"
          npm run generateAppleAIList
          echo "已同步 Apple AI 规则"
          npm run generateClashYaml
          echo "已生成 Clash YAML 文件"
          npm run generateClashMrs
          echo "已生成 Clash MRS 文件"

      - name: Commit and push changes
        run: |
          cd gists-hub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "文件与上游仓库相同，不需要提交，任务结束。"
          else
            echo "检测到文件变化，正在创建提交..."
            git commit -m "Automatic synchronization of rule lists"
            git push
            echo "提交完成，任务结束。"
          fi
